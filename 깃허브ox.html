<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>민사집행법 OX 학습 v8</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17212f;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}main{max-width:820px;margin:0 auto;padding:24px 15px 70px}h1{font-size:24px;margin:0 0 5px}h2{font-size:19px;margin:0 0 12px}.sub{color:#627184;font-size:13px}.card{background:#fff;border:1px solid #dce4ec;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 1px 2px #00000007}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}button{border:1px solid #bac7d6;background:white;color:#142538;border-radius:11px;padding:13px 14px;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:default}button.primary{background:#175cd3;color:white;border-color:#175cd3}button.good{background:#0e7d55;color:white;border-color:#0e7d55}button:focus-visible{outline:3px solid #ffae00}button.tab{padding:8px 13px;font-size:14px}button.active{background:#175cd3;color:white}#prompt{white-space:pre-wrap;font-size:19px;font-weight:600;line-height:1.9;margin:18px 0}.muted{color:#64748b}.tiny{font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#f1f5fb;border-radius:10px;padding:12px;text-align:center}.stat b{display:block;font-size:23px}.feedback{border-left:4px solid #175cd3;padding:12px;background:#eff6ff;border-radius:6px;margin-top:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.hidden{display:none}input[type=file]{max-width:100%}details{margin:10px 0}summary{cursor:pointer;font-weight:600}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:8px 5px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}.pil const QUESTIONS=[{"id":"LEE26-P0287-N025-0865","num":"0865","page":"287","unit":"제3편 부동산에 대한 강제집행 > 부동산 강제집행 > 경매대상","issue":"구분소유적 공유지분 경매 시 평가방법","q":"구분소유적 공유지분의 경우 그 공유자가 구분 소유의 목적인 특정부분을 처분(경매 포함)하면서 등기사항증명서상의 공유지분을 그 특정부분에 대한 표상 으로서 이전하는 때에는 경매대상은 특정 구분소유의 목적물이므로 신청서에 그 취지를 기재한다. 이러한 경 우 집행법원은 1필지 전체에 대한 목적물의 공유지분을 평가하게 하고 그에 따라 최저매각가격을 정한 후 경매를 실시하여야 한다.","answer":"X","original":"1필지의 토지의 위치와 면적을 특정하여 2인 이상이 구분소유하기로 하는 약정을 하고 그 구분소유자의 공유로 등기하는 이른바 구분소유적 공유관계에 있어서, 각 구분소유적 공유자가 자신의 권리를 타인에게 처분하는 경우 중에는 구분소유의 목적인 특정 부분을 처분하면서 등기부 상의 공유지분을 그 특정 부분에 대한 표상으로서 이전하는 경우와 등기부의 기재대로1필지 전체에 대한 진 정한 공유지분으로서 처분하는 경우가 있을 수 있고, 이 중 전자의 경우에는 그 제3자에 대하여 구분소유적 공유관계가 승계되나, 후자의 경우에는 제3자가 그 부동산 전체에 대한 공유지분을 취득하고 구분소유적 공 유관계는 소멸한다. 이는 경매에서도 마찬가지이므로, 전자에 해당하기 위하여는 집행법원이 공유지분이 아 닌 특정 구분소유 목적물에 대한 평가를 하게 하고 그에 따라 최저경매가격을 정한 후 경매를 실시하여야 하며, 그러한 사정이 없는 경우에는1필지에 관한 공유자의 지분에 대한 경매목적물은 원칙적으로1필지 전체 에 대한 공유지분이라고 봄이 상당하다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0287-N027-0867","num":"0867","page":"287","unit":"제3편 부동산에 대한 강제집행 > 부동산 강제집행 > 경매대상","issue":"증축부분 평가누락과 매수인의 소유권 취득","q":"기존건물에 부합된 증축 부분이 기존건물에 대한 경매절차에서 경매목적물로 평가되지 않았다면 매수인은 부합된 증축 부분의 소유권을 취득하지 못한다.","answer":"X","original":"건물의 증축부분이 기존건물에 부합하여 기존건물과 분리하여서는 별 개의 독립건물로서 효용을 가지지 못하는 이상, 기존건물에 대한 경매절차에서 경매목적물로 평가되지 아니 하였다 하더라도, 경락인은 부합된 증축 부분의 소유권을 취득한다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0287-N030-0870","num":"0870","page":"287","unit":"제3편 부동산에 대한 강제집행 > 부동산 강제집행 > 경매대상","issue":"법정지상권 발생 부담의 평가 고려 여부","q":"경 매대상인 토지를 평가할 당시에는 아직 발생하지 않았고 매각에 의하여 비로소 법정지상권이 발생하는 경우, 그 법정지상권에 의한 부담은 토지를 평가할 때 고려하지 않는다.","answer":"X","original":"경매대상인 토지를 평가할 당 시에는 아직 발생하지 않았고 매각에 의하여 비로소 법정지상권이 발생하는 경우, 그 법정지상권에 의한 부 담은 토지를 평가할 때 고려하여야 한다.","revised":"","point":"","compare":"","status":"보류"},{"id":"LEE26-P0289-N001-0878","num":"0878","page":"289","unit":"제3편 부동산에 대한 강제집행 > 부동산 강제집행 > 경매대상","issue":"허가 필요한 재산의 경매신청과 허가서 제출","q":"주무관청의 허가가 없으면 처분할 수 없는 재산에 대해서는 경매신청 시에 그 처분허가서가 제출되지 않으면 경매개시결정을 해서는 안된다.","answer":"X","original":"주무관청의 허가는 소유권취득의 요건이므로 매각허가결정전에 제출하면 된다.","revised":"~~주무관청의 허가는 소유권취득의 요건이므로 매각허가결정전에 제출하면 된다.~~\n[보완] 허가가 필요한 재산인지, 처분허가의 성질과 제출 시점이 무엇인지는 해당 재산에 적용되는 개별 법률과 판례를 구분해 판단해야 한다. 경매신청 시 허가서가 없다는 사유만으로 항상 개시결정을 금지한다고 일반화할 수 없다.","point":"허가 필요 여부와 시기는 재산 종류·적용 법률에 따라 달라져. 재단법인 기본재산 등 특수재산의 예외를 구분해.","compare":"허가를 요하는 재산 / 담보권 실행 / 경매개시결정과 매각허가결정","status":"보완 필요"},{"id":"LEE26-P0289-N003-0880","num":"0880","page":"289","unit":"제3편 부동산에 대한 강제집행 > 부동산 강제집행 > 경매대상","issue":"경매대상이 아닌 부동산의 경매와 소유권 취득","q":"경매의 대상이 아닌 부동산이 경매절차에서 경매신청된 다른 부동산과 함께 감정평가되어 매각기일에 공고되고 경매된 결과 매수인에게 매각되고 그 후 매수인에 대한 매각허가결정이 확정되었다면 채권자가 경매신청하지도 않았고 경매법원이 경매개시결정을 한 적도 없는 독 립된 부동산이더라도 매수인은 그 부동산에 대한 소유권을 취득한다.","answer":"X","original":"경매절차에서 매수인이 소 유권을 취득하는 대상은 법원이 경매개시결정을 하고 매각 대상으로 공고한 부동산에 한정된다. 만약 경매신 청이나 개시결정이 없었던 부동산이 착오로 함께 평가되어 매각되었더라도, 매수인은 그 부동산에 대한 소유 권을 취득할 수 없다.","revised":"경매신청과 경매개시결정의 대상이 아닌 독립 부동산은 착오로 감정평가·공고·매각에 포함되었다는 사정만으로 매수인이 그 소유권을 취득한다고 볼 수 없다.\n[보완] 경매개시결정과 매각대상의 동일성 및 독립 부동산인지 여부를 구체적으로 확인한다.","point":"감정평가·공고는 경매개시결정 대상이 아닌 독립 부동산에 대한 소유권 이전의 근거가 될 수 없어.","compare":"독립 부동산 / 종물·부합물 / 매각목적물 특정","status":"보완 필요"},{"id":"LEE26-P0289-N006-0883","num":"0883","page":"289","unit":"제3편 부동산에 대한 강제집행 > 부동산 강제집행 > 경매대상","issue":"광업권 등 공유지분의 강제집행","q":"광업권, 어업권 및 공동광업권자의 지분은 법률상 부 동산으로 취급되므로 이들은 강제경매의 대상이 된다.","answer":"X","original":"광업권, 어업권 및 공동광업권자의 지분은 강제경매가 아닌 그 밖의 재산권에 대한 집행방법으로 한다.","revised":"~~광업권, 어업권 및 공동광업권자의 지분은 강제경매가 아닌 그 밖의 재산권에 대한 집행방법으로 한다.~~\n[정정 보류] 광업권·어업권·공동광업권자의 지분은 각각 개별법상 성질과 집행특례를 분리하여 판단해야 한다. 세 권리 모두에 동일한 '그 밖의 재산권 집행' 방법을 적용한다는 원본 해설은 신뢰할 수 없다. 정확한 집행절차는 개별 근거 확인 전까지 확정하지 않는다.","point":"권리별 개별법과 민사집행규칙의 적용을 나눠 봐야 해. 정정할 집행절차의 세부 결론은 공식 원전 미확보로 제시하지 않아.","compare":"광업권 / 어업권 / 공동광업권 지분 / 그 밖의 재산권 집행","status":"해설 오류"},{"id":"LEE26-P0293-N006-0892","num":"0892","page":"293","unit":"제3편 부동산에 대한 강제집행 > 부동산 강제집행 > 경매신청 및 첨부서류","issue":"강제경매와 임의경매 신청 시 인지","q":"신청서는 서면으로 작성하여야 하며, 첨부할 인지는 정액으로 강제경매인 경우 집행권원의 수에 따른 인지를, 담보권실행을 위한 경매인 경우 경매 대상 부동산 의 수에 따른 인지를 붙여야 한다.","answer":"X","original":"신청서는 서면으로 작성하여야 하며, 첨부할 인지는 정액으로 강제경매인 경우 집행권원의 수에 따른 인지를, 담보권실행을 위한 경매인 경우 담보물권의 수에 따른 인지 를 붙여야 한다.","revised":"","point":"","compare":"","status":"보류"},{"id":"LEE26-P0295-N002-0898","num":"0898","page":"295","unit":"제3편 부동산에 대한 강제집행 > 부동산 강제집행 > 집행채권과 청구금액","issue":"임의경매 근저당권자의 청구금액 확장","q":"경매신청채권자가 아닌 근저당 권자는 배당요구하지 않아도 당연히 채권최고액의 범위 내에서 순위에 따른 배당을 받을 수 있으나 청구금 액을 확장하기 위하여는 배당요구 종기까지 채권계산서를 별도로 제출해야 한다.","answer":"X","original":"청구금액을 확 장하기 위하여는 배당요구 종기까지 배당요구를 하여야 한다.","revised":"경매신청채권자가 아닌 등기된 근저당권자는 일정한 요건에서 배당요구 없이 배당받을 수 있다.\n[보완] 배당요구 종기까지의 청구금액 확장 문제는 배당요구와 채권계산서 제출의 효력을 구별해야 하며, 원본 해설의 '반드시 배당요구'라는 표현을 모든 경우에 일률 적용하지 않는다.","point":"경매신청채권자 여부, 등기된 담보권의 피담보채권 범위, 채권계산서 제출 시점이 중요해.","compare":"경매신청채권자 / 배당요구채권자 / 채권계산서 / 채권최고액","status":"보완 필요"},{"id":"LEE26-P0295-N004-0900","num":"0900","page":"295","unit":"제3편 부동산에 대한 강제집행 > 부동산 강제집행 > 집행채권과 청구금액","issue":"임의경매 일부청구 후 부당이득반환청구","q":"담보권 실행을 위한 경매 에서 신청채권자가 피담보채권 중 일부만을 청구금액으로 기재한 경우, 이중경매신청 등 필요한 조치를 하지 아니하여 배당받지 못한 나머지 피담보채권액을 가지고 후순위채권자들에게 부당이득반환을 청구하는 것은 가능하다.","answer":"X","original":"이 경우 후순위채권자들에게 배당한 것이 법률상 원인 없는 것이 아니므로 부당이득 반환을 청구하는 것은 가능하지 않다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0298-N001-0902","num":"0902","page":"298","unit":"제3편 부동산에 대한 강제집행 > 부동산 강제집행 > 경매개시결정 심리","issue":"최선순위 가등기 있는 부동산 경매개시결정","q":"최선순위의 소유권이전등기청구권 의 보전을 위한 가등기가 있는 부동산에 대한 경매신청에 따라 경매절차를 진행할 경우, 경매절차 진행 중 에 최선순위 가등기권자가 본등기를 마치면 경매 대상물이 채무자의 소유가 아니라 제3자인 가등기권자의 소유로 귀속되어 민사집행법 제96조 제1항에 따라 매각절차를 취소하여야 하는 위험이 발생할 수 있으므로, 최선순위의 소유권이전등기청구권의 보전을 위한 가등기가 있는 부동산에 대한 경매신청은 기각하여야 한 다.","answer":"X","original":"권리신고가 되지 않아 담보가등기인지 순위보전의 가등기인지 알 수 없는 경우 그 가등기가 등기부상 최선순위이면 집행법원은 일단 순위보전을 위한 가등기로 보고 낙찰인에게 그 부담이 인수될 수 있다는 취지를 입찰물건명세서에 기재한 후 그에 기하여 경매절차를 진행하면 족하고, 반드시 그 가등기가 담보가등기인지 순위보전의 가등기인지 밝혀질 때까지 경매절차를 중지하여야 하는 것은 아니다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0298-N003-0904","num":"0904","page":"298","unit":"제3편 부동산에 대한 강제집행 > 부동산 강제집행 > 경매개시결정 심리","issue":"시효완성된 집행권원과 경매개시결정의 부정","q":"집행권원에 표시된 청구권에 대한 소멸시효가 완성된 경우 집행법원은 경매개시결정을 하여서는 아니 된다.","answer":"X","original":"집행권원에 표시된 청구권에 대한 소멸시효가 완성되었더라도 이는 채무자가 청구이의의 소로 다투어야 하는 부분이다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0298-N005-0906","num":"0906","page":"298","unit":"제3편 부동산에 대한 강제집행 > 부동산 강제집행 > 경매개시결정 심리","issue":"시효소멸된 집행권원과 경매신청","q":"집행법원이 경매신청서와 그 첨부서류에 의하여 강제집행의 요건 등에 관 하여 심사한 결과 집행력 있는 판결정본이 10년을 도과한 경우라면 경매신청을 기각 하여야 한다.","answer":"X","original":"판결의 소멸시효(10년)가 완성되었는지 여부는 실체법상의 문제이다. 집행법원은 경매신청 시 형식적 요 건만 심사하므로, 시효가 완성된 것처럼 보이더라도 경매신청을 각하 또는 기각할 수 없다. 이는 채무자가 청구이의의 소로 다투어야 할 사항이다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0419-N029-1493","num":"1493","page":"419","unit":"부동산 강제집행 > 배당절차 > 배당요구·배당받을 채권자","issue":"배당표 확정 후 부당이득반환청구","q":"집행력 있는 정본을 가진 채권자가 적법한 배당요구를 하지 않아 배당에서 제외되는 것으로 배당표가 작성되어 배당이 실시된 경우, 그 채권자는 자신이 적법한 배당요구를 했다면 배당받을 수 있었던 금액에 해당하는 돈을 배당받은 다른 채권자를 상대로 부당이득반환을 청구할 수 있다.","answer":"X","original":"집행력 있는 정본을 가진 채권자라도 민사집행법 제88조에 따라 적법한 배당요구를 하 지 않으면 배당받을 권리가 없다. 따라서 배당에서 제외되었더라도 다른 채권자를 상대로 부당이득반환을 청 구할 수 없다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0419-N030-1494","num":"1494","page":"419","unit":"부동산 강제집행 > 배당절차 > 배당요구·배당받을 채권자","issue":"배당금채권 압류의 배당요구 효력","q":"배당요구할 수 있는 채권자의 배당금채 권을 압류한 경우에는 그 압류를 배당요구로 볼 수 있어 별도로 집행법원에 채권자대위권의 요건을 갖추어 배당요구하지 않아도 배당받을 수 있다.","answer":"X","original":"배당요구채권자의 채권을 압류한 자는 채권자대위권에 기하여 직접 자신의 이름으로 배당요구를 해야만 배당받을 수 있다. 단순히 압류한 사실만으로는 배당요구로 볼 수 없다.","revised":"","point":"","compare":"","status":"보류"},{"id":"LEE26-P0424-N004-1498","num":"1498","page":"424","unit":"부동산 강제집행 > 배당절차 > 임차보증금 반환채권자","issue":"주택 매도 후 임차 시 대항력 취득 시기","q":"주택소유자가 주민등록 전입신고를 마치고 거주하다가 주택을 매도함과 동시에 매수인으로부터 다시 임차하여 계속 거주하는 경우에는 주택임 대차보호법상 임차인으로서 대항력을 취득하는 시기는 매수인 명의의 소유권이전등기일부터이다.","answer":"X","original":"주택임대차보호법상 임차인으로서 대항력을 취득하는 시기는 매수인 명의의 소유권이전등기일 다음날부터이 다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0424-N008-1502","num":"1502","page":"424","unit":"부동산 강제집행 > 배당절차 > 임차보증금 반환채권자","issue":"임차보증금 반환과 임차권등기 말소의 동시이행","q":"임대인의 임대차보증금 반환의무와 임차인의 주택임대차보호법 제3조의3에 의한 임차권등기 말소의무는 동 시이행관계에 있다.","answer":"X","original":"임대인의 임대차보증금 반환의무가 임차인의 주택임대차보호법 제3조의3에 의한 임차권등기 말소의무보다 선행해야할 의무다. 즉 보증금 반환의무와 등기말소의무는 동시이행관계가 아 니다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0425-N018-1512","num":"1512","page":"425","unit":"부동산 강제집행 > 배당절차 > 임차보증금 반환채권자","issue":"미등기 주택 소액임차인의 우선변제권","q":"소액임차인의 우선변제권에 관하여 주택임대차보호법 제8조 제1항 후문에서 임차인은 주택에 대한 경매신청의 등기 전에 대항요건(주택의 인도 와 전입신고)을 갖추어야 한다고 규정하고 있어, 임차주택 자체에 경매신청의 등기가 되어 있어야 하므로 미 등기 주택인 경우에는 소액임차인의 우선변제권은 인정되지 않는다.","answer":"X","original":"소액임차인의 우선변제권에 관하여 주택임대차보호법 제8조 제1항 후문에서 임차인은 주택에 대한 경매신청의 등기 전에 대항요건(주택 의 인도와 전입신고)을 갖추어야 한다고 규정하고 있다. 이는 미등기 주택에도 그대로 적용된다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0425-N021-1515","num":"1515","page":"425","unit":"부동산 강제집행 > 배당절차 > 임차보증금 반환채권자","issue":"대항력·우선변제권 겸유 임차인의 배당요구","q":"주택임대차보호법에 따른 주택임차인의 대항력 발생일과 임대차계약서상 확정일자가 모두 당해 주택에 관한 1순위 근저당권 설정일보다 앞서는 경우, 주택임차인은 특별한 사정이 없는 한 대항력뿐 아니라 1순위 근저당권자보다 선순위의 우선변제권도 가지므로, 그 주택에 관하여 개시된 경매절차에서 배당요구종기 이전에 배당요구를 하지 않더라도 1순위 근저당권자보다 우선하는 배당순위를 가진다.","answer":"X","original":"우선변제권이 있는 임차인이라 하더라도 경매절차에서 배당요구 종기까지 배 당요구를 하지 않으면 배당을 받을 수 없다(등기된 임차권 등 예외 제외).","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0425-N022-1516","num":"1516","page":"425","unit":"부동산 강제집행 > 배당절차 > 임차보증금 반환채권자","issue":"저당부동산 압류 전후 연체차임의 보증금 공제","q":"보증금이 수수된 저당부동산에 관한 임대차계약이 저당부동산에 대한 경매로 종료된 경 우, 임차인이 연체한 차임이 있다면 연체 차임 중 저당부동산의 압류 이전 부분에 한하여 보증금에서 당연히 공제된다.","answer":"X","original":"저당부동산에 대한 압류의 전후와 관계없이 임차인이 연체한 차임 등의 상당액이 임차 인이 배당받을 보증금에서 당연히 공제됨은 물론, 저당권자가 차임채권 등에 대하여 위와 같은 방법으로 별 개로 저당권을 실행한 경우에도 채권집행 절차에서 임차인이 실제로 차임 등을 지급하거나 공탁하지 아니하 였다면 잔존하는 차임채권 등의 상당액은 임차인이 배당받을 보증금에서 당연히 공제된다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0426-N026-1520","num":"1520","page":"426","unit":"부동산 강제집행 > 배당절차 > 임차보증금 반환채권자","issue":"대항력있는 임차인과 가압류채권자의 배당관계","q":"주택임대차보호법상 임차인이 대항 요건을 미리 갖추었다면 확정일자를 부여받은 날짜가 비록 가압류일자보다 늦은 경우라도 가압류채권자를 선 순위라고 볼 수는 없다.","answer":"X","original":"주택임대차보호법에 따른 임차권의 순위는 확정일자를 기준으로 하므로 확정일자와 가압류일자를 비교하여 우선순위를 정하게 된다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0426-N030-1524","num":"1524","page":"426","unit":"부동산 강제집행 > 배당절차 > 임차보증금 반환채권자","issue":"임차보증금 분할지급 시 우선변제권 기준","q":"임차인이 임대인에게 임차보증금의 일부만을 지급하고 주택임대차보호법 제3조 제1항에서 정한 대항요건과 임대차계약증서상의 확정일자를 갖 춘 다음 나머지 보증금을 나중에 지급하였다면 특별한 사정이 없는 한 대항요건과 확정일자를 갖춘 때를 기 준으로 임차보증금 전액에 대해서 후순위권리자나 그 밖의 채권자보다 우선하여 변제를 받을 권리를 가지지 는 못한다.","answer":"X","original":"임차인이 임차보증금의 일부를 지급하고 대항요건과 확정일자를 갖춘 다음 나머지 보 증금을 나중에 지급하였다면, 임차인은 임차보증금 전액에 대해서 확정일자 부여일을 기준으로 후순위권리자 나 그 밖의 채권자보다 우선하여 변제를 받을 권리를 가진다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0427-N033-1527","num":"1527","page":"427","unit":"부동산 강제집행 > 배당절차 > 임차보증금 반환채권자","issue":"소유권 양도 후 임차 시 대항력","q":"등기부상 소유자 로 되어 있던 자가 소유권을 양도한 후에 임차권을 취득하고 계속 거주하는 경우 임차인은 새로운 소유자인 임대인 명의의 소유권이전등기가 된 날부터 임차인으로서 대항력을 가진다.","answer":"X","original":"주택 소유자가 주택 을 매도함과 동시에 임차인이 된 경우, 임차인으로서의 대항력은 매수인 명의의 소유권이전등기일 '다음 날' 부터 발생한다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0427-N038-1532","num":"1532","page":"427","unit":"부동산 강제집행 > 배당절차 > 임차보증금 반환채권자","issue":"주택임차인의 이해관계인 해당 여부","q":"임차인은 주택임대차 보호법 제3조 제1항의 규정에 따라 주택의 인도와 주민등록을 마치고, 확정일자를 받거나 소액임차인에 해 당하는 경우에 한하여 이해관계인에 해당한다.","answer":"X","original":"대항력이나 확정일자, 소액임차인 요건은 배당순 위요건과 관련된 것이지 이해관계인 요건하고는 무관하다. 법 90조4호에 따라 부동산 위의 권리자로서 그 권리를 증명하여 권리신고를 한 사람이 이해관계인이 되므로 설사 대항력이나 우선변제권을 가졌더라도 권리 신고를 하지 않으면 이해관계인이 될 수 없다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0427-N042-1536","num":"1536","page":"427","unit":"부동산 강제집행 > 배당절차 > 임차보증금 반환채권자","issue":"집행관의 임대차관계 조사 잘못과 불법행위","q":"부동산 현황조사 과정에서 임대차관 계를 제대로 확인하지 않은 집행관의 직무상 잘못이, 그 결과로 경매절차의 진행에 관한 통지를 받지 못하여 우선변제권의 행사에 필요한 조치를 취하지 못함으로써 손해를 입은 임차인에 대하여 불법행위를 구성한 다.","answer":"X","original":"집행관의 현황조사는 경매절차의 원활한 진행을 위한 것일 뿐, 모든 임차인을 찾아내어 통지 할 의무까지 부담하는 것은 아니다. 따라서 현황조사에서 임차인이 누락되었다는 사실만으로 국가(집행관)의 불법행위가 성립한다고 보기는 어렵다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0428-N046-1540","num":"1540","page":"428","unit":"부동산 강제집행 > 배당절차 > 임차보증금 반환채권자","issue":"구분점포 임대차의 상가임대차법 적용 기준","q":"임차인이 수개의 구분점포 를 동일한 임대인에게 임차하여 하나의 사업장으로 사용하면서 단일한 영업을 하는 경우이더라도 구분점포 각각에 대하여 별개의 임대차계약서가 작성되어 있다면 각각의 점포의 보증금액으로 상가건물임대차보호법의 우선변제를 받을 임차인의 범위에 해당하는지 여부를 판단하여야 한다.","answer":"X","original":"임차인이 수개의 구분점 포를 동일한 임대인에게 임차하여 하나의 사업장으로 사용하면서 단일한 영업을 하는 경우와 같이 일괄하여 단일한 임대차 관계가 성립한 것으로 볼 수 있는 때에는 보증금액의 합산액으로 상가건물임대차보호법의 우 선변제를 받을 임차인의 범위에 해당하는지 여부를 판단하여야 한다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0433-N008-1553","num":"1553","page":"433","unit":"부동산 강제집행 > 배당절차 > 우선변제채권자 배당Ⅰ > 근저당권·전세권","issue":"근저당권 채권최고액 초과 채권의 잉여금 배당","q":"근저당권거래계약의 결산기에 이미 발생한 채권이 그 채권최고액을 초과하고 있고 근저당권자가 경매신청서에 그 초과액까지 청 구하고 있을 경우에, 근저당권설정자와 채무자가 동일하고 민사집행법 제148조에 따라 배당받을 채권자나 제3취득자가 없는 경우 매각대금 중 그 채권최고액을 초과하는 금액이 있으면 이는 근저당권설정자에게 반 환하여야 한다.","answer":"X","original":"근저당권자가 경매신청서에 채권최고액을 초과하는 금액을 청구하고, 배당받을 다른 채권자나 제3취득자가 없는 경우, 법원은 실제 채권액이 채권최고액을 초과하더라도 그 초과액을 포함 한 실제 채권 전액을 근저당권자에게 배당하여야 하며, 최고액 초과분을 근저당권설정자(채무자)에게 반환해 서는 안 된다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0433-N012-1557","num":"1557","page":"433","unit":"부동산 강제집행 > 배당절차 > 우선변제채권자 배당Ⅰ > 근저당권·전세권","issue":"담보가등기권자의 채권신고와 배당","q":"경매개시결정이 등기되기 전에 경료된 담 보가등기권리가 매각에 의하여 소멸하는 경우, 위 담보가등기권리자는 집행법원이 정한 기간 안에 채권신고 를 하지 않더라도 매각대금을 배당받을 권리를 보유한다.","answer":"X","original":"경매개시결정이 등기되기 전에 경료된 담보가등기권리가 매각에 의하여 소멸하는 경우, 위 담보가등기권리자는 집행법원이 정한 기간 안에 채권신 고를 해야 매각대금을 배당받을 권리를 보유한다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0433-N013-1558","num":"1558","page":"433","unit":"부동산 강제집행 > 배당절차 > 우선변제채권자 배당Ⅰ > 근저당권·전세권","issue":"압류 후 자동채권 발생과 상계","q":"채권압류명령을 받을 당시에 반대채권과 피압류채권 모두의 이행기가 도래한 때에는 제3채무자가 당연히 반대채권으로써 상계할 수 있고, 반대채권과 피압류채권 모두 또는 그 중 어느 하나의 이행기가 아직 도래하지 아니하여 상계적상에 놓이지 아니하였더 라도 그 이후 제3채무자가 피압류채권을 채무자에게 지급하지 아니하고 있는 동안에 반대채권과 피압류채권 모두의 이행기가 도래한 때에도 제3채무자는 반대채권으로써 상계할 수 있고, 이로써 지급을 금지하는 명령 을 신청한 채권자에게 대항할 수 있다.","answer":"X","original":"압류의 효력 발생 당시에 대립하는 양 채권이 상계적상 에 있거나, 그 당시 반대채권(자동채권)의 변제기가 도래하지 아니한 경우에는 그것이 피압류채권(수동채권) 의 변제기와 동시에 또는 그보다 먼저 도래하여야 한다. 사안의 경우 어디에도 해당되지 않으므로 제3채무 자는 상계로 대항할 수 없다.","revised":"압류 효력 발생 당시 양 채권이 상계적상에 있거나, 그 당시 자동채권의 변제기가 도래하지 않았더라도 자동채권의 변제기가 수동채권의 변제기와 동시에 또는 먼저 도래하면 상계로 압류채권자에게 대항할 수 있다.\n[보완] ~~사안의 경우 어디에도 해당되지 않으므로 제3채무자는 상계로 대항할 수 없다.~~ 지문은 압류 후 양 채권의 변제기가 도래하면 선후관계와 무관하게 상계 가능하다고 일반화하여 X이다. 압류 당시 이미 상계적상인 경우까지 부정하는 뜻은 아니다.","point":"압류 전 취득한 자동채권은 변제기가 수동채권보다 늦게 도래하는 경우 상계로 압류채권자에게 대항하기 어려워.","compare":"자동채권·수동채권 / 압류 당시 상계적상 / 압류 후 변제기 도래","status":"보완 필요"},{"id":"LEE26-P0434-N019-1564","num":"1564","page":"434","unit":"부동산 강제집행 > 배당절차 > 우선변제채권자 배당Ⅰ > 근저당권·전세권","issue":"전유부분 전세권자의 대지권 환가대금 배당순위","q":"사안에서 甲의 전세권은 전유 부분에 관하여만 설정받았으므로 甲이 배당요구의 종기 내에 배당요구를 하더라도 대지권의 환가대금에 대한 배당순위에 있어서는 乙의 근저당권에 우선할 수 없다.","answer":"X","original":"甲의 전세권은 전유부분에 관하여만 설정 받았더라도 대지권은 분리처분이 금지되므로 甲이 배당요구의 종기 내에 배당요구를 하면 대지권의 환가대금 에 대한 배당순위에 있어서 乙의 근저당권에 우선한다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0434-N021-1566","num":"1566","page":"434","unit":"부동산 강제집행 > 배당절차 > 우선변제채권자 배당Ⅰ > 근저당권·전세권","issue":"'권리신고'의 배당요구 효력","q":"권리신고는 배당요구와 구별되는 것으로 권리신고를 한 것만으로 당 연히 배당을 받게 되는 것은 아니다. 따라서 채권자가 경매목적 부동산에 관하여 경매개시결정 후 가압류결 정을 받은 다음 채권의 수액을 기재한 서면에 그 가압류 결정을 첨부하여 제출하면서 제목을 ‘권리신고’라고 하여 제출하였다면 이는 적법한 배당요구라고 볼 수 없다.","answer":"X","original":"채권자가 제출한 서면이 '권리신고서' 라는 제목을 달고 있더라도, 그 내용에 채권의 액수가 기재되어 있고 가압류결정 등 채권 증명 서류가 첨부 되어 있다면, 이는 실질적으로 배당요구로서의 효력이 인정된다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0434-N022-1567","num":"1567","page":"434","unit":"부동산 강제집행 > 배당절차 > 우선변제채권자 배당Ⅰ > 근저당권·전세권","issue":"존속기간 중 전세권에 대한 배당요구","q":"전세권이 존속기간의 만료 등으로 종료되기 전이라도 최선 순위 전세권자의 채권자는 전세권이 설정된 부동산에 대한 경매절차에서 채권자대위권에 기하거나 전세금반 환채권에 대하여 압류 및 추심명령을 받은 다음 추심권한에 기하여 자기 이름으로 전세권에 대한 배당요구 를 할 수 있다.","answer":"X","original":"전세권이 존속하는 동안에는 전세금반환채권이 현실적으로 존재하지 않으므로, 채권자가 이를 대위하거나 압류·추심하여 배당요구를 할 수 없다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0434-N025-1570","num":"1570","page":"434","unit":"부동산 강제집행 > 배당절차 > 우선변제채권자 배당Ⅰ > 근저당권·전세권","issue":"존속기간 중인 전세권의 강제집행","q":"등기된 전세권 중 존속기간이 만료되 지 않은 전세권 자체를 집행권원에 의해 강제집행 하는 때의 실행방법은 부동산매각절차에 따라 집행해야 한다.","answer":"X","original":"전세권 자체는 부동산에 대한 용익물권이자 담보물권으로서 독립된 재산권이다. 따라서 전 세권 자체를 강제집행의 대상으로 할 때에는 부동산경매절차가 아닌 '그 밖의 재산권에 대한 집행' 방법에 따라야 한다. 즉, 채권압류 및 현금화(특별현금화방법 등) 절차를 거친다.","revised":"~~전세권 자체를 강제집행의 대상으로 할 때에는 부동산경매절차가 아닌 '그 밖의 재산권에 대한 집행' 방법에 따라야 한다. 즉, 채권압류 및 현금화(특별현금화방법 등) 절차를 거친다.~~\n[추가 확인 필요] 존속기간 중 전세권 자체에 대한 집행방법을 민사집행법 제251조만으로 확정할 수 없다. 적용할 집행절차의 직접 공식 근거가 확보될 때까지 구체적 방법을 단정하지 않는다.","point":"전세권 자체에 대한 집행과 전세금반환채권에 대한 집행을 구별해야 해.","compare":"전세권 자체 / 전세금반환채권 / 민사집행법 제251조","status":"보완 필요"},{"id":"LEE26-P0437-N005-1576","num":"1576","page":"437","unit":"부동산 강제집행 > 배당절차 > 우선변제채권자 배당Ⅱ > 근로자 우선변제채권","issue":"최종 3월분 임금의 산정 시기","q":"근로계약관계가 1996. 11. 16. 종료한 경우 라면 ‘최종 3월분 임금’은 1996. 8. 16.부터 1996. 11. 15.까지에 대한 임금인 1996. 9월분, 10월분, 11월분 임금이라 할 것이고, 그 중 11월분 임금을 지급받았다면 1996. 8월분 임금까지 포함된다.","answer":"X","original":"근로계약관계가 1996. 11. 16.종료한 경우라면 ‘최종 3월분 임금’은 1996. 8. 16.부터 1996. 11. 15.까지에 대한 임금인 1996. 9월분, 10월분, 11월분 임금이라 할 것이고, 그 중 11월분 임금을 지급받았 다면 1996. 9월분, 10월분 임금이다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0438-N018-1590","num":"1590","page":"438","unit":"부동산 강제집행 > 배당절차 > 우선변제채권자 배당Ⅱ > 근로자 우선변제채권","issue":"임금 지연손해금의 최우선변제권","q":"근로기준법에 의하면 근로관계로 인한 채권 중 최종 3개월분의 임금, 재해보상금의 채권은 사용자의 총재산에 대하여 질권 또는 저당권에 의하여 담보된 채권, 조세·공과금 및 다른 채권에 우선하여 변제되어야 한다고 규정하고 있는바, 위와 같은 임금 등 채권의 최우선변제권은 근로자의 생활안정을 위한 사회정책적 고려에서 담보물권자 등의 희생 아래 인정되고 있는 점, 민법 제334조, 제360조 등에 의하면 공시방법이 있는 민법상의 담보물권의 경우에도 우선변제권 이 있는 피담보채권에 포함되는 이자 등 부대채권 및 그 범위에 관하여 별도로 규정하고 있음에 비추어 볼 때, 임금 등에 대한 지연손해금 채권에 대하여도 최우선변제권이 인정된다고 봄이 상당하다 할 것이다.","answer":"X","original":"최우선변제권은 근로자의 생존권 보장을 위해 임금 '원금'에 대해서만 인정되는 강력한 권리이다. 임 금 지급 지연으로 인해 발생한 지연손해금은 일반채권에 불과하며 최우선변제 대상에 포함되지 않는다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0438-N021-1593","num":"1593","page":"438","unit":"부동산 강제집행 > 배당절차 > 우선변제채권자 배당Ⅱ > 조세채권·제3취득자·잉여금","issue":"제3취득자에게 부과된 조세와 저당권의 우선순위","q":"저당권이 설정된 후 저당 부동산의 소유권이 제3자에게 양도된 경우에 양수인인 현 소유자에게 부과된 조세의 법정기일이 저당권의 설정 전이라면 저당권보다 우선하여 배당한다.","answer":"X","original":"저당권이 설정된 후 저당부동산의 소유권이 제3자 에게 양도된 경우에 양수인인 현 소유자에게 부과된 조세의 법정기일이 저당권 설정 전이라 하더라도 저당 권설정자의 체납조세가 아니므로 조세의 우선징수권이 없다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0439-N029-1601","num":"1601","page":"439","unit":"부동산 강제집행 > 배당절차 > 우선변제채권자 배당Ⅱ > 조세채권·제3취득자·잉여금","issue":"증액경정처분과 조세채권의 법정기일","q":"납세의무자가 신고납세방식인 국세의 과세표준과 세액을 신고한 다음 매각 재산에 저당권 등의 설정등기를 마쳤는데, 이후에 과세관청이 당초 신고한 세액을 증액하는 경정을 하 여 당초보다 증액된 세액을 고지한 경우, 당초 처분은 증액경정처분에 흡수되므로, 저당권 등에 의하여 담보 되는 채권은 위 국세 전액에 대하여 우선한다.","answer":"X","original":"납세의무자가 신고납세방식인 국세의 과세표준과 세액을 신고한 다음 매각재산에 저당권 등의 설정등기를 마쳤는데 이후 과세관청이 당초 신고한 세액을 증 액하는 경정을 하여 당초보다 증액된 세액을 고지하였다면, 당초 신고한 세액은 그 신고일이 법정기일이 되 어 저당권부 채권보다 우선하여 징수할 수 있다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0439-N031-1603","num":"1603","page":"439","unit":"부동산 강제집행 > 배당절차 > 우선변제채권자 배당Ⅱ > 조세채권·제3취득자·잉여금","issue":"임차보증금반환채권과 당해세의 우선순위","q":"국세기본법 제35조 제3항에도 불구하고 주택임대차보호법 제3조의2 제2항에 따라 대항요건과 확정일자를 갖춘 임차권에 의하여 담보된 임대차보증 금반환채권 또는 같은 법 제2조에 따른 주거용 건물에 설정된 전세권에 의하여 담보된 채권은 해당 임차권 또는 전세권이 설정된 재산이 국세의 강제징수 또는 경매 절차를 통하여 매각되어 그 매각금액에서 국세를 징수하는 경우 그 확정일자 또는 설정일보다 법정기일이 빠른 해당 재산에 대하여 부과된 상속세, 증여세 및 종합부동산세의 우선 징수 순서에 대신하여 변제될 수 있다.","answer":"X","original":"확정일자를 갖춘 임대차보증금반환 채권 또는 전세보증금반환채권은 그 확정일자 또는 설정일보다 법정기일이 늦은 당해세에 우선하는 것으로 개정되었다. 종전에는 선후구분 없이 당해세가 우선했으나 세법개정으로 2023.4.1.부터 적용된다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0439-N038-1610","num":"1610","page":"439","unit":"부동산 강제집행 > 배당절차 > 우선변제채권자 배당Ⅱ > 조세채권·제3취득자·잉여금","issue":"배당잉여금의 교부","q":"각 채권자에게 배당하고 남은 잉여금은 제3취 득자에게 지급되어야 하나, 제3취득자가 경매법원에 권리신고를 하지 아니하여 이해관계인으로서의 지위를 취득하지 못하였다면 지급하지 않는다.","answer":"X","original":"각 채권자에게 배당하고 남은 잉여금은 제3취득자에게 지 급되어야 하며, 제3취득자가 경매법원에 권리신고를 하지 아니하여 이해관계인으로서의 지위를 취득하지 못 하였더라도 마찬가지다.","revised":"","point":"","compare":"","status":"보류"},{"id":"LEE26-P0440-N043-1615","num":"1615","page":"440","unit":"부동산 강제집행 > 배당절차 > 우선변제채권자·사해행위취소·잉여금","issue":"사해행위취소 가액배상 시 수익자의 안분배당 청구","q":"수익자가 채무자의 채권자인 경우 수 익자가 가액배상을 할 때에 수익자 자신도 사해행위취소의 효력을 받는 채권자 중 1인이라는 이유로 취소채 권자에 대하여 총채권액 중 자기의 채권에 대한 안분액의 분배를 청구할 수 있다.","answer":"X","original":"사해행위의 수익자가 채무자의 다른 채권자이기도 한 경우, 그는 가액배상 의무를 먼저 이행해야 한다. 자신의 채권을 내세워 배상할 금액에서 안분액을 상계하거나 분배를 청구하는 것은 허용되지 않는다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0440-N048-1620","num":"1620","page":"440","unit":"부동산 강제집행 > 배당절차 > 우선변제채권자·사해행위취소·잉여금","issue":"한정승인 후 상속재산 담보권자와 상속채권자의 우열","q":"X 부동산에 대한 경매절차에서 배 당이 이루어질 경우, 丁은 乙보다 선순위로 채권만족을 받을 수 있다.","answer":"X","original":"한정승인자가 상속재산에 대하여 저당권 등을 설정한 경우, 이는 상속재산의 처분행위에 해당하지만 그 저당권설정행위 자체가 당연히 무효가 되는 것은 아니다. 따라서 저당권자는 적법하게 담보권을 취득하며, 피상속인의 일반채권자보다 우선 하여 변제받을 수 있다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0441-N052-1624","num":"1624","page":"441","unit":"부동산 강제집행 > 배당절차 > 우선변제채권자·사해행위취소·잉여금","issue":"임의경매 제3취득자의 잉여금 교부","q":"임의경매에서 경매개시결정등기 후에 전 소유자로부터 소유권을 취득한 제3취득자가 경매법원에 권리신고를 하지 아니하여 이해관계인으로서의 지위를 취득하지 못하였다면 전 소유자에게 배당해야한다.","answer":"X","original":"잉여금은 경매절차 종결 당시의 소유자에게 지급해야 한다. 따라서 제3취득자가 있다면 비록 권리 신고를 하지 않았더라도 등기사항증명서 등으로 확인하여 그에게 지급해야 한다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0448-N005-1629","num":"1629","page":"448","unit":"부동산 강제집행 > 배당절차 > 배당기일의 준비와 실시","issue":"가압류채권자와 후순위 근저당권자의 배당관계","q":"가압류등기 후 근당권설정등기가 마쳐지고 이후 강제경매신청 이 이루어진 경우, 배당관계에 있어서 근저당권자는 선순위 가압류채권자에 대하여 우선변제권을 주장할 수 없으므로 가압류권자와 근저당권자, 경매신청채권자는 각 채권액에 따른 안분비례에 의하여 평등배당을 받을 수 있다.","answer":"X","original":"가압류등기 후 설정된 근저당권자는 가압류채권자와의 관계에서는 동순위로 안분배당을 받지만, 자신보다 후순위인 채권자(예: 경매신청을 한 일반채권자)에 대해서는 우선변제권을 가진다. 판례(흡 수설)에 따르면, 1차로 가압류채권자와 근저당권자가 채권액에 비례하여 안분배당을 받고, 2차로 근저당권자 는 자신의 채권액 중 1차 안분배당으로 받지 못한 금액을 후순위 채권자(경매신청채권자 등)의 배당액에서 흡수하여 우선변제받을 수 있다. 따라서 셋이 무조건 평등배당을 받는다는 설명은 틀렸다.","revised":"선순위 가압류채권자와 후순위 근저당권자 및 일반채권자가 경합하면, 각 채권자의 배당참가 자격과 우선순위를 반영하여 1차 안분관계를 검토하고, 근저당권자는 자신보다 후순위인 일반채권자에게 우선변제권을 주장하여 그 배당 몫을 흡수할 수 있다.\n[보완] ~~1차로 가압류채권자와 근저당권자가 채권액에 비례하여 안분배당을 받고~~ 라는 문구만으로는 경매신청 일반채권자의 1차 배당참가를 누락하는 것처럼 읽힐 수 있으므로 전체 참가자와 후순위 몫 흡수의 순서를 구분한다.","point":"가압류에 대항할 수 없는 근저당권과 후순위 일반채권자의 관계를 분리해야 해.","compare":"선순위 가압류 / 후순위 근저당권 / 일반채권자 / 흡수배당","status":"보완 필요"},{"id":"LEE26-P0449-N009-1633","num":"1633","page":"449","unit":"부동산 강제집행 > 배당절차 > 배당기일의 준비와 실시","issue":"임금채권과 조세채권의 우선순위","q":"매각부동산에 저당권 등에 의해 담보되는 채권이 없는 경우 임금 기타 근로관계로 인한 채권은 당해세를 제외한 조세채권보다 우선한다.","answer":"X","original":"매각부동산에 저당권 등에 의해 담보되는 채권이 없는 경우 임금채권은 당해세를 포함한 조세채권보다 우선 한다. 저당권 등으로 담보되는 채권이 있는 경우에는 최우선변제 임금채권만 당해세를 포함한 조세채권에 우 선한다.","revised":"담보권으로 담보되는 채권이 없다는 이유만으로 모든 임금채권의 우선순위를 당해세 여부에 따라 일률적으로 판단해서는 안 된다. 일반 임금채권은 근로기준법 제38조 제1항의 원칙과 단서에 따라 조세·공과금 및 담보권의 선후관계를 따져야 한다. 최종 3개월분 임금 등 제38조 제2항의 최우선변제채권은 별도로 우선한다.\n[보완] ~~저당권 등으로 담보되는 채권이 있는 경우에는 최우선변제 임금채권만 당해세를 포함한 조세채권에 우선한다.~~ 담보권 존재만으로 일반 임금채권의 조세채권에 대한 우선 여부가 일률적으로 결정되는 것은 아니다.","point":"일반 임금채권과 최우선변제 임금채권은 우선순위 규칙이 달라. 조세와 담보권의 선후관계를 함께 따져야 해.","compare":"근로기준법 제38조 제1항·제2항 / 당해세 / 담보권보다 우선하는 조세","status":"보완 필요"},{"id":"LEE26-P0449-N016-1640","num":"1640","page":"449","unit":"부동산 강제집행 > 배당절차 > 배당기일의 준비와 실시","issue":"배당이의의 방식","q":"채무자와 채권자는 배당기일에 출석하여 이의할 수 있을 뿐 아니라 배당표원안이 비치된 이후에는 배당기일이 끝날 때까지 서면으로도 이의할 수 있다.","answer":"X","original":"배당표에 대한 이의는 배당기일에 출석하여 구술로 하는 것이 원칙이다. 다만 채무자는 예외적으로 서면으로 도 할 수 있다(민사집행법 제151조 제2항).","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0453-N004-1644","num":"1644","page":"453","unit":"부동산 강제집행 > 배당절차 > 배당이의의 소송","issue":"배당이의소송의 소송물가액 산정","q":"채권자가 원고일 경우에는 이의신청으로 상대방 채권자의 채권을 부인한 액수를 표준으로 소송물가액을 산정한다.","answer":"X","original":"배당이의의 소에서 원고가 채권자인 경 우, 소송물가액은 이의를 통해 자신이 추가로 배당받고자 하는 금액, 즉 '원고의 채권액'과 '피고에 대한 배 당액 중 이의한 금액' 중 적은 금액을 기준으로 산정한다.","revised":"배당이의의 소에서 소송목적의 값은 '배당증가액'을 기준으로 한다(민사소송 등 인지규칙 제16조 제6호). 채권자인 원고가 배당표 변경으로 실제 추가 취득할 경제적 이익을 기준으로 하므로 기존 배당액, 미변제 채권액, 피고 배당액 중 이의 범위를 함께 고려한다.\n[보완] ~~'원고의 채권액'과 '피고에 대한 배당액 중 이의한 금액' 중 적은 금액~~ 이라는 표현은 원고의 총채권액과 미변제액을 구분하지 않아 오해 소지가 있다. 구체적 계산례는 공식 원전 미확보.","point":"원고가 추가로 받게 되는 배당증가액이 소가야. 기존 배당을 공제한 미변제액도 확인해야 해.","compare":"총채권액 / 미변제 채권액 / 기존 배당액 / 피고 이의액","status":"보완 필요"},{"id":"LEE26-P0453-N007-1647","num":"1647","page":"453","unit":"부동산 강제집행 > 배당절차 > 배당이의의 소송","issue":"가집행선고부 판결 채권자에 대한 배당이의","q":"채무자가 배당표에 대하여 가집행선고 있는 판결정본을 가진 채권자에 대하여 배당이의를 하는 경우에는 청구이의의 소를 제기할 수 없으나, 배당 이의의 소를 제기할 수는 있다.","answer":"X","original":"배당절차에서 작성된 배당표에 대하여 채무자가 이의하는 경우, 집행력 있는 집행권원의 정본을 가지지 않은 채권자에 대하여 이의한 채무자는 배당이의의 소를 제기해야 하고(민사집행법 제154조 제1항), 집행력 있는 집행권원의 정본을 가진 채권자에 대하여 이의한 채무자는 집행권원의 집행력을 배제시켜야 하므로 청구이의의 소를 제기해야 한다(같은 조 제2항).","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0453-N008-1648","num":"1648","page":"453","unit":"부동산 강제집행 > 배당절차 > 배당이의의 소송","issue":"배당이의 후 채무자의 소제기","q":"집행력 있는 집행권원의 정본을 가진 채권자에 대하여 배당기일에 이의한 채무자는 배당이의의 소를 제기하여야 한다.","answer":"X","original":"배당기일에 채무자가 배 당이의를 한 경우, 상대방 채권자가 집행력 있는 집행권원의 정본을 가지고 있다면 채무자는 배당이의의 소 가 아닌 '청구이의의 소'를 제기하여야 한다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0454-N018-1658","num":"1658","page":"454","unit":"부동산 강제집행 > 배당절차 > 배당이의의 소송","issue":"배당이의소송의 공격방법 제한","q":"배당이의를 신청함에 있어서는 그 사유를 진술할 필요가 없 지만, 일단 사유를 진술한 이상 배당이의소송에서 원고의 청구를 뒷받침하는 공격방법은 배당기일에 이의한 사유에 국한된다.","answer":"X","original":"배당기일에 이의를 신청할 때는 상대방과 이의하는 배당액을 명시하면 족하고 구체적인 사유까지 진술할 필요는 없다. 배당기일에 진술한 이의사유는 배당이의 소송에서 다른 사유를 주장 하는 것을 제한하지 않으며, 원고는 변론종결 시까지 자유롭게 이의사유를 추가하거나 변경할 수 있다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0454-N024-1664","num":"1664","page":"454","unit":"부동산 강제집행 > 배당절차 > 배당이의의 소송","issue":"파산관재인 제기 배당이의소송 관할","q":"배당이의의 소는 배당을 실시한 집행법원이 속한 지방법원의 관할에 전속하고, 파산관재인이 제기한 부인의 소와 부인의 청구 사건은 파산계속법원의 관할에 전속한다. 파산관재인이 부인권을 행사하면서 원상회복으로서 배당이의의 소를 제기 한 경우 채무자 회생 및 파산에 관한 법률이 민사집행법의 특별법 지위에 있으므로 파산법원이 배당이의 소 송의 관할법원이 된다.","answer":"X","original":"배당이의의 소는 배당을 실시한 집행법원이 속한 지방법원의 관할에 전속 하고, 파산관재인이 제기한 부인의 소와 부인의 청구 사건은 파산계속법원의 관할에 전속한다. 그러나 파산 관재인이 부인권을 행사하면서 원상회복으로서 배당이의의 소를 제기한 경우 비록 채무자 회생 및 파산에 관한 법률이 민사집행법의 특별법 지위에 있지만 배당을 실시한 집행법원이 배당이의 소송의 관할법원이 된 다.","revised":"","point":"","compare":"","status":"적정"},{"id":"LEE26-P0455-N030-1670","num":"1670","page":"455","unit":"부동산 강제집행 > 배당절차 > 배당이의의 소송","issue":"배당이의소송과 선순위채권자","q":"채권자가 제기하는 배당이의의 소에서 피고의 채권이 존 재하지 않는 것으로 인정되더라도 그 배당액 전액이 이의신청을 하지 아니한 원고의 선순위 채권자에게 배 당되어야 할 경우에는 이를 원고의 배당액으로 할 수 없다.","answer":"X","original":"이의신청을 하지 아니한 다른 채권 자의 채권을 참작할 필요는 없다.","revised":"","point":"","compare":"","status":"적정"}];
const SEED=[{"id":"8차-v8-1회독-0865-1","qid":"LEE26-P0287-N025-0865","round":1,"choice":"X","confident":true,"correct":true,"at":"2026-10-30 13:36 KST (기존 기록, 정확한 시각 미확인)","source":"기존 풀이이력 CSV"},{"id":"8차-v8-1회독-0867-1","qid":"LEE26-P0287-N027-0867","round":1,"choice":"X","confident":true,"correct":true,"at":"2026-10-30 13:36 KST (기존 기록, 정확한 시각 미확인)","source":"기존 풀이이력 CSV"},{"id":"8차-v8-1회독-0878-1","qid":"LEE26-P0289-N001-0878","round":1,"choice":"O","confident":true,"correct":false,"at":"2026-10-30 13:39 KST (대화 시각, 정확한 시각 미확인)","source":"대화 답변 재채점: 이전 응답의 정답 판정 오류 수정"}];
const VERSION='v8-20261030';
const SOURCE_SHA='8dbb09beddb356d1239994ec9389ae26e8e4bc64b44fe790a814c44937d6359e';
const ACTIVE=QUESTIONS.filter(q=>q.status!=='보류');
const MAP=new Map(QUESTIONS.map(q=>[q.id,q]));
const DBNAME='minjip-ox-v8-20261030';
let db, attempts=[], round=1, pending=null, tab='quiz', lastSavedId=null;
const $=id=>document.getElementById(id);
function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DBNAME,1);req.onupgradeneeded=()=>{const d=req.result;d.createObjectStore('attempts',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'key'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function txComplete(t){return new Promise((resolve,reject)=>{t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error||new Error('transaction aborted'));});}
async function getAll(){const t=db.transaction('attempts','readonly'),r=t.objectStore('attempts').getAll();const done=txComplete(t);await done;return r.result;}
async function getMeta(key){const t=db.transaction('meta','readonly'),r=t.objectStore('meta').get(key);const done=txComplete(t);await done;return r.result?.value;}
async function putMeta(key,value){const t=db.transaction('meta','readwrite');t.objectStore('meta').put({key,value});await txComplete(t);}
async function putAttempt(a){const t=db.transaction('attempts','readwrite');t.objectStore('attempts').add(a);await txComplete(t);}
async function bulkInsert(items){const t=db.transaction('attempts','readwrite'),s=t.objectStore('attempts');for(const a of items)s.put(a);await txComplete(t);}
function idFor(qid,r){return `ox:${VERSION}:${r}:${qid}`;}
function answered(qid,r=round){return attempts.some(a=>a.qid===qid&&a.round===r);}
function nextQ(){return ACTIVE.find(q=>!answered(q.id))||null;}
function classify(a){return a.correct?(a.confident?'확신 정답':'불확실 정답'):(a.confident?'확신 오답':'불확실 오답');}
function weakness(){const out=new Map();for(const a of attempts){if(a.correct&&a.confident)continue;const v=out.get(a.qid)||{qid:a.qid,first:a,events:[]};v.events.push(a);out.set(a.qid,v);}return [...out.values()].map(v=>{const all=attempts.filter(a=>a.qid===v.qid).sort((a,b)=>a.round-b.round);const last=all.at(-1);const repeated=all.filter(a=>!a.correct&&a.confident).length>=2;const priority=v.events.some(a=>!a.correct&&a.confident)?1:v.events.some(a=>!a.correct)?2:3;return {...v,priority,repeated,last,status:last.correct&&last.confident?'재확인 필요 (변형 OX 미검증)':repeated?'집중 복습':'복습 대기'};}).sort((a,b)=>a.priority-b.priority||a.qid.localeCompare(b.qid));}
function updateHeader(){const current=attempts.filter(a=>a.round===round),done=current.length,correct=current.filter(a=>a.correct).length;$('summary').textContent=`${round}회독 · ${done}/${ACTIVE.length}문항 · 정답 ${correct} · 오답 ${done-correct}`;$('banner').textContent=`저장 방식: 이 브라우저의 IndexedDB · 문제은행 SHA-256 ${SOURCE_SHA.slice(0,12)}…`;}
function renderQuiz(){updateHeader();const q=nextQ();$('quiz').classList.remove('hidden');$('notebook').classList.add('hidden');$('history').classList.add('hidden');$('backup').classList.add('hidden');$('prompt').textContent=q?q.q:'현재 회독을 완료했어. 다음 회독을 시작하거나 기록을 백업해.';$('qmeta').textContent=q?`${q.num}번 · PDF ${q.page}쪽 · ${q.issue} · ${q.status}`:`${round}회독 완료`;$('choices').classList.toggle('hidden',!q);$('next').classList.add('hidden');$('feedback').classList.add('hidden');$('roundBtn').classList.toggle('hidden',!!q);pending=null;}
async function answer(choice,confident){const q=nextQ();if(!q)return;for(const b of document.querySelectorAll('#choices button'))b.disabled=true;const a={id:idFor(q.id,round),qid:q.id,round,choice,confident,correct:choice===q.answer,at:new Date().toISOString(),source:'웹앱 터치'};try{await putAttempt(a);attempts=await getAll();lastSavedId=a.id;pending={a,q};const f=$('feedback');f.classList.remove('hidden');const plain=a.correct&&a.confident;f.innerHTML=`<b>${plain?'정답이야.':a.correct?'정답이야. (불확실 정답)':'오답이야. 정답: '+escapeHTML(q.answer)}</b>`+(plain?'':`<div class="tiny muted">${escapeHTML(q.point||q.revised||q.original||'해설 미기록')}</div>`)+`<div class="tiny muted">저장 완료 · ${escapeHTML(a.id)}</div>`;$('next').classList.remove('hidden');updateHeader();}catch(e){$('error').textContent='저장 실패: '+e.message+' · 답변은 기록되지 않았어. 다시 시도해.';for(const b of document.querySelectorAll('#choices button'))b.disabled=false;}}
function showTab(t){tab=t;for(const id of ['quiz','notebook','history','backup'])$(id).classList.toggle('hidden',id!==t);for(const b of document.querySelectorAll('[data-tab]'))b.classList.toggle('active',b.dataset.tab===t);if(t==='quiz')renderQuiz();if(t==='notebook')renderNotebook();if(t==='history')renderHistory();if(t==='backup')renderBackup();}
function renderNotebook(){const w=weakness();$('notebook').innerHTML=`<h2>오답·불확실 정답 노트 (${w.length})</h2><p class="sub">최초 취약 기록 보존 · 동일 문항 중복 항목 없음 · 이해 확인은 변형 OX 검증 후 별도 처리</p>`+(w.length?w.map(x=>{const q=MAP.get(x.qid);return `<details class="card"><summary>${escapeHTML(q.num)}번 · ${escapeHTML(q.issue)} · ${escapeHTML(x.status)} · ${x.priority}순위</summary><p><b>최초 취약:</b> ${escapeHTML(classify(x.first))} · <b>최근:</b> ${escapeHTML(classify(x.last))}</p><p>${escapeHTML(q.point||q.revised||q.original)}</p><p class="sub">비교: ${escapeHTML(q.compare||'기록 없음')}</p></details>`;}).join(''):'<p>아직 복습 대상이 없어.</p>');}
function renderHistory(){const lines=attempts.slice().sort((a,b)=>a.round-b.round||a.qid.localeCompare(b.qid));const stats=[...new Set([1,...attempts.map(a=>a.round)])].sort((a,b)=>a-b).map(r=>{const arr=attempts.filter(a=>a.round===r);return `<tr><td>${r}회독</td><td>${arr.length}/${ACTIVE.length}</td><td>${arr.length?(arr.filter(a=>a.correct).length/arr.length*100).toFixed(1)+'%':'—'}</td><td>${arr.filter(a=>a.correct&&a.confident).length}</td></tr>`;}).join('');$('history').innerHTML=`<h2>회독 통계</h2><table><tr><th>회독</th><th>풀이</th><th>정답률</th><th>확신 정답</th></tr>${stats}</table><h2 style="margin-top:25px">풀이 이력 (${attempts.length})</h2><table><tr><th>문항</th><th>회독</th><th>답변</th><th>결과</th></tr>${lines.map(a=>`<tr><td>${escapeHTML(MAP.get(a.qid)?.num)}</td><td>${a.round}</td><td>${escapeHTML(a.choice)}${a.confident?'':'?'}</td><td>${escapeHTML(classify(a))}</td></tr>`).join('')}</table>`;}
function renderBackup(){$('backup').innerHTML=`<h2>백업 및 복원</h2><p>기록은 현재 브라우저에만 저장돼. 기기를 바꾸거나 브라우저 데이터를 지우면 사라질 수 있으니 JSON 백업을 내려받아 보관해.</p><div class="grid"><button id="exportJson" class="primary">전체 기록 JSON 백업</button><button id="exportCsv">풀이 이력 CSV 내보내기</button></div><p><label><b>JSON 백업 파일 복원</b><br><input type="file" id="restoreFile" accept=".json,application/json"></label></p><button id="restore" class="primary">복원하기 (중복 ID 병합)</button><p class="sub">원본 문제은행 SHA-256 일치 여부를 확인하고, 동일 시도 ID는 중복 추가하지 않아.</p><p id="restoreResult"></p>`;$('exportJson').onclick=exportJson;$('exportCsv').onclick=exportCsv;$('restore').onclick=restoreJson;}
function download(name,body,mime){const blob=new Blob([body],{type:mime});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function exportJson(){download('민사집행법_OX_학습기록_백업.json',JSON.stringify({version:VERSION,sourceSha:SOURCE_SHA,round,attempts,exportedAt:new Date().toISOString()},null,2),'application/json;charset=utf-8');}
function exportCsv(){const cols=['id','qid','round','choice','confident','correct','at','source'];const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';download('민사집행법_OX_풀이이력.csv','\ufeff'+cols.join(',')+'\n'+attempts.map(a=>cols.map(c=>quote(a[c])).join(',')).join('\n'),'text/csv;charset=utf-8');}
async function restoreJson(){try{const file=$('restoreFile').files[0];if(!file)throw Error('백업 파일을 선택해.');const obj=JSON.parse(await file.text());if(obj.version!==VERSION||obj.sourceSha!==SOURCE_SHA||!Array.isArray(obj.attempts))throw Error('문제은행 버전 또는 백업 형식이 일치하지 않아.');const seen=new Set();for(const a of obj.attempts){if(!MAP.has(a.qid)||MAP.get(a.qid).status==='보류'||!Number.isInteger(a.round)||a.round<1||a.round>1000||!['O','X'].includes(a.choice)||typeof a.confident!=='boolean'||a.correct!==(a.choice===MAP.get(a.qid).answer)||a.id!==idFor(a.qid,a.round)||seen.has(a.id))throw Error('백업 기록이 유효하지 않거나 중복되어 있어.');seen.add(a.id);}const existing=new Map(attempts.map(a=>[a.id,a]));for(const a of obj.attempts){if(existing.has(a.id)&&JSON.stringify(existing.get(a.id))!==JSON.stringify(a))throw Error('동일 시도 ID의 내용이 서로 달라.');}const fresh=obj.attempts.filter(a=>!existing.has(a.id));await bulkInsert(fresh);attempts=await getAll();round=Math.max(round,...attempts.map(a=>a.round),1);await putMeta('round',round);$('restoreResult').textContent=`복원 완료: 신규 ${fresh.length}건, 중복 제외 ${obj.attempts.length-fresh.length}건. 총 ${attempts.length}건.`;updateHeader();}catch(e){$('restoreResult').textContent='복원 실패: '+e.message;}}
async function nextRound(){round++;await putMeta('round',round);showTab('quiz');}
async function initialize(){try{if(!window.indexedDB)throw Error('이 브라우저는 IndexedDB를 지원하지 않아.');db=await openDB();const seeded=await getMeta('seeded');if(!seeded){const old=await getAll();if(!old.length){await bulkInsert(SEED);}await putMeta('seeded',true);}attempts=await getAll();round=await getMeta('round')||1;round=Math.max(round,...attempts.map(a=>a.round),1);await putMeta('round',round);$('loading').classList.add('hidden');$('app').classList.remove('hidden');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(b.dataset.choice,b.dataset.conf==='true'));$('next').onclick=()=>{if(!pending)return;for(const b of document.querySelectorAll('#choices button'))b.disabled=false;showTab('quiz');};$('roundBtn').onclick=nextRound;showTab('quiz');}catch(e){$('loading').textContent='저장소 초기화 실패: '+e.message+' · Safari/Chrome 일반 탭에서 파일을 열어줘.';}}
initialize();
</script></body></html>
